name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar entorno
        shell: bash
        run: |
          java -version
          gradle --version
          echo "SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-no-configurado}}"
          sdkmanager --list_installed | head -50
      - name: Compilar APK Kotlin
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: PS-Media-Downloader-Pro-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
