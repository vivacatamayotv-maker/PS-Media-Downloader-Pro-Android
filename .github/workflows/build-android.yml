name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar entorno
        shell: bash
        run: |
          java -version
          gradle --version
          echo "SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-no-configurado}}"
          sdkmanager --list_installed | head -50
      - name: Compilar APK Kotlin y registrar errores
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace --warning-mode all 2>&1 | tee gradle-build.log
      - name: Resumen de errores para diagnóstico
        if: failure()
        shell: bash
        run: |
          echo '## Error de compilación Android' >> "$GITHUB_STEP_SUMMARY"
          echo 'Busca en este resumen el primer mensaje de Kotlin o Gradle.' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          (grep -nEi '^e:|(^|[[:space:]])error:|Unresolved reference|Compilation error|FAILURE:|What went wrong:|Could not (resolve|find)|Execution failed for task' gradle-build.log | head -45 || true) | tee errores-resumen.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS-Android-Registro-Compilacion
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: PS-Media-Downloader-Pro-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
