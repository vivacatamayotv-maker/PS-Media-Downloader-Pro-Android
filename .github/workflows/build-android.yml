name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --stacktrace
      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS-Media-Downloader-Android
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
